name: Android install test

# Installs a released APK on emulators at the oldest Android we support, Android 9 and a current
# one, then launches the app and checks it stays up. Runs by hand for any release, and from CI
# after each tag's GitHub release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose APK to test (blank for the latest release)
        required: false
        default: ''
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  install:
    name: Install and launch on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: google_apis
          - api: 28
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - name: Download this release's APKs and the previous release's
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ inputs.release_tag }}
        run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" -L 50 --exclude-drafts --json tagName,publishedAt -q 'sort_by(.publishedAt) | reverse | .[].tagName' | grep -E '^v[1-9]')
          tag=${REL_TAG:-$(echo "$tags" | head -1)}
          prev=$(echo "$tags" | grep -A1 -x "$tag" | sed -n 2p)
          echo "Testing $tag, updating from $prev"
          mkdir -p apk prev
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.apk' -D apk
          gh release download "$prev" -R "$GITHUB_REPOSITORY" -p 'packet-mail-*[0-9].apk' -D prev
          ls -l apk prev
          echo "APK=$(ls apk/*.apk | grep -E -- '-[0-9]+\.apk$')" >> "$GITHUB_ENV"
          echo "SPLIT_APK=$(ls apk/*-x86_64.apk 2>/dev/null)" >> "$GITHUB_ENV"
          echo "PREV_APK=$(ls prev/*.apk)" >> "$GITHUB_ENV"
      - name: Check the ARM APKs hold only their own processor's libraries
        if: matrix.api == 28
        run: |
          for pair in arm64:arm64-v8a arm32:armeabi-v7a x86_64:x86_64; do
            f=$(ls apk/*-${pair%%:*}.apk 2>/dev/null) || { echo "No ${pair%%:*} APK in this release"; continue; }
            abis=$(unzip -Z1 "$f" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "$f: $abis"
            [ "$abis" = "${pair##*:} " ] || { echo "FAIL: expected only ${pair##*:}"; exit 1; }
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-install-test.sh out "$APK" "$SPLIT_APK" "$PREV_APK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-install-api${{ matrix.api }}
          path: out
