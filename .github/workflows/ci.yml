name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rebuild the Android release and GitHub release for this existing tag (no TestFlight upload)
        required: false
        default: ''
      build_number:
        description: Build number to use with release_tag (match the App Store build)
        required: false
        default: ''

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Core package tests
        working-directory: packages/mail_core
        run: dart test

  bbs:
    name: Driver against a real LinBPQ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start the test BBS
        run: test-bbs/run.sh
      - name: Driver scenarios against it
        working-directory: packages/mail_core
        run: dart test test/driver_live_test.dart
        env:
          PACKET_MAIL_TEST_BBS: '1'
      - name: BBS log on failure
        if: failure()
        run: docker logs packet-mail-test-bbs

  demo-bbs:
    name: Demo BBS and the driver against it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server tests
        working-directory: demo-bbs
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Start the demo BBS container
        run: demo-bbs/run.sh -e DEMO_BBS_CONNECTS_PER_MINUTE=1000 -e DEMO_BBS_MAX_PER_IP=20
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Driver and sync engine against it
        working-directory: packages/mail_core
        run: dart test test/driver_demo_test.dart
        env:
          PACKET_MAIL_DEMO_BBS: '1'
      - name: Demo BBS log
        if: always()
        run: docker logs packet-mail-demo-bbs

  xrouter:
    name: Driver against a real XRouter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start the test XRouter
        run: test-bbs/xrouter/run.sh
      - name: Driver scenarios against it
        working-directory: packages/mail_core
        run: dart test test/xrouter_live_test.dart
        env:
          PACKET_MAIL_TEST_XROUTER: '1'
      - name: XRouter log on failure
        if: failure()
        run: docker logs packet-mail-test-xrouter

  feedback-receiver:
    name: Feedback receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: feedback-receiver
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Container image builds
        run: docker build -q -t packet-mail-feedback-receiver feedback-receiver

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: packet-mail-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr packet-mail-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: packet-mail-ios-unsigned
          path: packet-mail-unsigned.ipa

  testflight:
    name: Upload to TestFlight
    needs: [test, bbs, xrouter]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Skip until signing is set up
        id: ready
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "TestFlight upload skipped: needs secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and variable APPLE_TEAM_ID."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.go
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build, sign and upload
        if: steps.ready.outputs.go
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archive unsigned and sign only at export with the cloud-managed distribution
          # certificate. Signing the archive made Xcode create a new development
          # certificate on every fresh runner until the account hit Apple's limit.
          flutter build ios --release --no-codesign --build-name=$(v=${GITHUB_REF_NAME#v}; echo ${v%%-*}) --build-number=${{ github.run_number }}
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key"

  android-release:
    name: Signed Android app bundle
    needs: [test, bbs, xrouter]
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      REL_TAG: ${{ inputs.release_tag || github.ref_name }}
      BUILD: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Skip until signing is set up
        id: ready
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signed Android build skipped: needs the ANDROID_UPLOAD_* secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        if: steps.ready.outputs.go
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.go
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build signed app bundle and APK
        if: steps.ready.outputs.go
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          v=${REL_TAG#v}; v=${v%%-*}
          flutter build appbundle --release --build-name=$v --build-number=$BUILD
          flutter build apk --release --build-name=$v --build-number=$BUILD
          rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go
        with:
          name: packet-mail-android-bundle
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go
        with:
          name: packet-mail-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  github-release:
    name: GitHub release
    needs: [android-release]
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REL_TAG: ${{ inputs.release_tag || github.ref_name }}
      BUILD: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        id: apk
        continue-on-error: true
        with:
          name: packet-mail-android-apk
      - name: Publish the release with the signed APK
        if: steps.apk.outcome == 'success'
        run: |
          v=${REL_TAG#v}; v=${v%%-*}
          # Flutter pads the version to three parts (1.0 becomes 1.0.0); show what the stores show.
          case "$v" in *.*.*) ;; *) v="$v.0" ;; esac
          apk="packet-mail-$v-$BUILD.apk"
          mv app-release.apk "$apk"
          printf 'Packet Mail %s (build %s).\n\n- iPhone: from the App Store, or TestFlight for testers.\n- Android: install `%s` below. Google Play is coming.\n' "$v" "$BUILD" "$apk" > notes.md
          if gh release view "$REL_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$apk" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$REL_TAG" "$apk" -R "$GITHUB_REPOSITORY" --title "Packet Mail $v ($BUILD)" --notes-file notes.md
          fi
