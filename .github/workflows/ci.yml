name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Core package tests
        working-directory: packages/mail_core
        run: dart test

  bbs:
    name: Driver against a real LinBPQ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start the test BBS
        run: test-bbs/run.sh
      - name: Driver scenarios against it
        working-directory: packages/mail_core
        run: dart test test/driver_live_test.dart
        env:
          PACKET_MAIL_TEST_BBS: '1'
      - name: BBS log on failure
        if: failure()
        run: docker logs packet-mail-test-bbs

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: packet-mail-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr packet-mail-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: packet-mail-ios-unsigned
          path: packet-mail-unsigned.ipa

  testflight:
    name: Upload to TestFlight
    needs: [test, bbs]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Skip until signing is set up
        id: ready
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "TestFlight upload skipped: needs secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and variable APPLE_TEAM_ID."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.go
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build, sign and upload
        if: steps.ready.outputs.go
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Archive unsigned and sign only at export with the cloud-managed distribution
          # certificate. Signing the archive made Xcode create a new development
          # certificate on every fresh runner until the account hit Apple's limit.
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key"

  android-release:
    name: Signed Android app bundle
    needs: [test, bbs]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Skip until signing is set up
        id: ready
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signed Android build skipped: needs the ANDROID_UPLOAD_* secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
      - uses: actions/setup-java@v4
        if: steps.ready.outputs.go
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        if: steps.ready.outputs.go
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build signed app bundle
        if: steps.ready.outputs.go
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          flutter build appbundle --release --build-number=${{ github.run_number }}
          rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go
        with:
          name: packet-mail-android-bundle
          path: build/app/outputs/bundle/release/app-release.aab
