[package]
name = "demo-bbs"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Internet-safe demo BBS for Packet Mail, wire compatible with LinBPQ's FBB port"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
