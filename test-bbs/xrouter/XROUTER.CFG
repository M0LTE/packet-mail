# XRouter for Packet Mail's driver tests. Local only: no radio ports, no
# DNS, nothing reachable beyond the container. Callsigns use the
# unallocated Q0 prefix.
#
# Comment lines must start in column 1 (XRouter is strict about this).

NODECALL=Q0XR
NODEALIAS=XRTEST
CONSOLECALL=Q0XR
LOCATOR=IO91LK

# The mailbox. PMSHADDR gives it a full address for mail it sends.
PMSCALL=Q0XR-2
PMSHADDR=.#42.GBR.EURO

# Telnet only, on XRouter's host-system stack.
TELNETPORT=23

CTEXT
Q0XR XRouter test node
***

# XRouter needs at least one port; a loopback one goes nowhere.
INTERFACE=1
    TYPE=LOOPBACK
    PROTOCOL=KISS
    MTU=256
ENDINTERFACE

PORT=1
    ID=Loopback
    INTERFACENUM=1
ENDPORT
