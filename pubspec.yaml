name: packetmail
description: "Packet radio BBS mail for your phone"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.7

workspace:
  - packages/mail_core

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mail_core: any
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  drift_flutter: ^0.3.1
  drift: ^2.35.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_email_sender: ^11.2.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-SourceSerif4.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
